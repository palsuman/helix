[package]
name = "helix-bench"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bench]]
name = "platform"
harness = false

[dev-dependencies]
async-trait = "=0.1.92"
criterion = { version = "=0.8.2", default-features = false, features = ["cargo_bench_support"] }
helix-config = { path = "../helix-config" }
helix-core = { path = "../helix-core" }
helix-fs = { path = "../helix-fs", features = ["testutil"] }
helix-ipc = { path = "../helix-ipc" }
helix-log = { path = "../helix-log" }
serde_json = "=1.0.145"
tokio = { version = "=1.53.1", features = ["rt-multi-thread", "net", "time", "macros"] }

[target.'cfg(unix)'.dev-dependencies]
libc = "=0.2.189"

[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_System_ProcessStatus", "Win32_System_Threading"] }