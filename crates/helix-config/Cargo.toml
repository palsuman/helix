[package]
name = "helix-config"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
helix-core = { path = "../helix-core" }
helix-log = { path = "../helix-log" }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
ts-rs = "=12.0.1"

# No dev-dependencies: the service is synchronous, so its tests need no async
# runtime. The watch loop that drives it lives in `helix-kernel`, and is tested
# there against a real container.
