[workspace]
resolver = "2"
members = [
    "crates/helix-config",
    "crates/helix-core",
    "crates/helix-fs",
    "crates/helix-ipc",
    "crates/helix-log",
    "crates/helix-kernel",
    "crates/helix-stream",
    "crates/helix-state",
    "crates/helix-supervisor",
    "crates/helix-workspace",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
license = "UNLICENSED"
publish = false

[profile.dev]
opt-level = 0
debug = true

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "unwind"
