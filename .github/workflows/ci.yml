name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  build-lint-test:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.0.2
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json
      - name: Install Linux Tauri prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Install JavaScript dependencies
        run: |
          npm ci
          npm --prefix frontend ci
      - name: Verify repository plans and dependency pins
        run: |
          npm run check:dependencies
          npm run check:waves
      - name: Check Rust formatting
        run: cargo fmt --all -- --check
      - name: Lint Rust
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test Rust
        run: cargo test --workspace
      - name: Build Rust workspace
        run: cargo build --workspace
      - name: Lint frontend
        run: npm --prefix frontend run lint
      - name: Type-check frontend
        run: npm --prefix frontend run typecheck
      - name: Build frontend
        run: npm --prefix frontend run build
      - name: Build Tauri application
        run: npm --prefix frontend run tauri:build
      - name: Test complete WebView IPC boundary
        if: runner.os == 'macOS'
        run: npm --prefix frontend run test:ipc-e2e
      - name: Verify generated TypeScript is current
        if: runner.os == 'Linux'
        run: npm run check:types
