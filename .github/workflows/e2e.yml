name: Native E2E

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-e2e:
    name: E2E (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.15.0
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install Linux prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xvfb
      - name: Install frontend dependencies
        run: npm --prefix frontend ci
      - name: Check frontend
        run: |
          npm --prefix frontend run lint
          npm --prefix frontend run typecheck
      - name: Build isolated E2E application
        run: npm --prefix frontend run e2e:build
      - name: Test Linux native app
        if: runner.os == 'Linux'
        timeout-minutes: 10
        run: xvfb-run -a npm --prefix frontend run test:e2e
      - name: Test native app
        if: runner.os != 'Linux'
        timeout-minutes: 10
        run: npm --prefix frontend run test:e2e
      - name: Upload E2E diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: e2e-${{ matrix.os }}
          path: target/e2e-artifacts/
          retention-days: 14
          if-no-files-found: warn
